<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Old Tele</title>
<!-- Librería hls.js desde CDN para reproductor de Magic Kids -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Archivo+Narrow:wght@400;600&display=swap');

  :root{
    --bg: #0a0e18;
    --panel: #0f1b2e;
    --guide: #142a4d;
    --cyan: #4be0e8;
    --yellow: #ffcf3f;
    --ink: #e8ecf4;
    --muted: #6f85ab;
    --line: #23385c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--ink);
    font-family:'Archivo Narrow', sans-serif;
    display:flex; justify-content:center;
  }
  .tv{
    width:100%; max-width:920px; background:var(--panel);
    border:2px solid var(--line); border-radius:10px; overflow:hidden;
    position:relative;
  }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    opacity:.35;
  }
  .static-flash{
    position:absolute; inset:0; background:var(--ink); opacity:0; pointer-events:none; z-index:6;
    transition:opacity .08s;
  }
  .static-flash.on{opacity:.9;}

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px; border-bottom:2px solid var(--line); background:var(--guide);
  }
  .brand{font-family:'VT323', monospace; font-size:26px; color:var(--yellow); letter-spacing:1px;}
  .clockbox{display:flex; align-items:center; gap:10px; font-family:'VT323', monospace; font-size:20px; color:var(--cyan);}
  .clockbox input[type="datetime-local"]{
    background:#0a1830; color:var(--ink); border:1px solid var(--line); border-radius:4px;
    font-family:'VT323', monospace; font-size:16px; padding:3px 6px;
  }
  .clockbox button{
    background:var(--cyan); color:#04222a; border:none; border-radius:4px; padding:5px 10px;
    font-family:'Archivo Narrow', sans-serif; font-weight:600; font-size:12px; cursor:pointer;
  }
  .clockbox button:hover{background:#7dedf3;}
  .clockbox .live{
    background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400;
  }
  .live-date{color:var(--ink); font-size:16px; padding-right:4px;}

  .body{display:flex; min-height:420px;}
  .channels{
    width:190px; border-right:2px solid var(--line); background:#0b1524;
  }
  .ch-row{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .ch-row:hover{background:#122543;}
  .ch-row.active{background:var(--guide); box-shadow:inset 3px 0 0 var(--yellow);}
  .ch-num{
    font-family:'VT323', monospace; font-size:22px; color:var(--muted); width:26px; text-align:right; flex-shrink:0;
  }
  .ch-row.active .ch-num{color:var(--yellow);}
  .ch-name{font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .ch-row.active .ch-name{color:var(--yellow);}
  .ch-logo{
    width:24px; height:24px; object-fit:contain;
  }
  .panel-logo{
    height:22px; width:auto; max-width:80px; object-fit:contain; vertical-align:middle; margin-left:6px;
  }

  .main{flex:1; padding:22px 26px;}

  /* REPRODUCTOR Y PANTALLAS */
  .cover{
    width:100%; height:520px; background:#000; border:1px solid var(--line);
    border-radius:6px; overflow:hidden; margin-bottom:18px; position:relative;
  }

  .cover iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  
  .player-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
  }

  .player-wrapper video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Tarjeta para enlaces externos (LaCartoons) */
  .external-player-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #10213d 0%, #060a12 100%);
    text-align: center;
    padding: 20px;
  }
  .external-player-card h3 {
    font-family: 'VT323', monospace;
    font-size: 32px;
    color: var(--yellow);
    margin: 0 0 10px 0;
  }
  .external-player-card p {
    font-size: 16px;
    color: var(--muted);
    margin: 0 0 20px 0;
  }
  .btn-play-external {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--yellow);
    color: #111;
    font-weight: bold;
    font-size: 18px;
    padding: 12px 24px;
    border-radius: 6px;
    text-decoration: none;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  .btn-play-external:hover {
    background: #ffe08a;
    transform: scale(1.03);
  }

  /* Controles básicos HLS Magic Kids */
  .custom-controls{
    position:absolute; bottom:0; left:0; right:0; height:48px;
    background:linear-gradient(transparent, rgba(0,0,0,0.85));
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; opacity:0; transition:opacity 0.3s ease; z-index:20;
  }
  .player-wrapper:hover .custom-controls{ opacity:1; }
  .ctrl-group{ display:flex; align-items:center; gap:12px; }
  .ctrl-btn{
    background:transparent; border:none; color:var(--ink);
    font-size:18px; cursor:pointer; padding:4px 8px; border-radius:4px;
  }
  .ctrl-btn:hover{ color:var(--yellow); background:rgba(255,255,255,0.1); }
  .volume-slider{ width:70px; accent-color:var(--yellow); cursor:pointer; }

  .eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 4px; display:flex; align-items:center;}
  .show-title{font-family:'VT323', monospace; font-size:34px; color:var(--ink); margin:0 0 2px; line-height:1;}

  .progress-wrap{margin-top:14px; margin-bottom:6px;}
  .progress-bar{
    height:10px; background:#0a1830; border:1px solid var(--line); border-radius:5px; overflow:hidden;
  }
  .progress-fill{height:100%; background:var(--yellow);}
  .progress-labels{
    display:flex; justify-content:space-between; font-family:'VT323', monospace; font-size:15px; color:var(--muted); margin-top:4px;
  }

  .up-next{
    margin-top:22px; padding-top:14px; border-top:1px dashed var(--line);
    display:flex; justify-content:space-between; align-items:flex-end;
  }
  .up-next-info{ flex:1; }
  .up-next .eyebrow{margin-bottom:8px;}
  .up-next-item{font-size:13px; color:var(--ink); opacity:.8; margin:3px 0;}

  .off-air{font-family:'VT323', monospace; font-size:22px; color:var(--muted); padding:40px 0;}

  .ticker{
    border-top:2px solid var(--line); background:#0b1524; padding:8px 0; overflow:hidden; white-space:nowrap;
  }
  .ticker span{
    display:inline-block; padding-left:100%; font-family:'VT323', monospace; font-size:16px; color:var(--muted);
    animation:scroll 28s linear infinite;
  }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
</style>
</head>
<body>

<div class="tv">
  <div class="scanlines"></div>
  <div class="static-flash" id="flash"></div>

  <div class="topbar">
    <div class="brand">◉ TELE</div>
    <div class="clockbox">
      <span id="liveDate" class="live-date"></span>
      <input type="datetime-local" id="dtInput">
      <button onclick="sintonizar()">Sintonizar</button>
      <button class="live" onclick="volverEnVivo()">En vivo</button>
    </div>
  </div>

  <div class="body">
    <div class="channels" id="channelList"></div>
    <div class="main">
      <div id="embedContainer"></div>
      <div id="mainPanel"></div>
    </div>
  </div>

  <div class="ticker"><span id="tickerText"></span></div>
</div>

<script>
const EPOCH = new Date("2026-05-27T00:00:00");

// STREAMS DIRECTOS
const MAGIC_KIDS_STREAM_URL = "https://kali.vdopanel.com:3007/stream/play.m3u8";
const LOCOMOTION_EMBED_URL = "https://serenotv.com/?cdm_embed=canal&pid=25664";

// CAPÍTULOS DE YOUTUBE
const WINX_EPISODES = [
  ...Array.from({length: 26}, (_, i) => ({
    title: `Temporada 1 - Capítulo ${i + 1}`,
    url: `https://www.youtube.com/embed?listType=playlist&list=PLJN-li1uNbvSi5K73npKg8iBTH6b8GK2F&index=${i}`
  })),
  ...Array.from({length: 26}, (_, i) => ({
    title: `Temporada 2 - Capítulo ${i + 1}`,
    url: `https://www.youtube.com/embed?listType=playlist&list=PLJN-li1uNbvSyskxirfjCOVM3ocQ8pkBx&index=${i}`
  }))
];

const WITCH_EPISODES = [
  ...Array.from({length: 26}, (_, i) => ({
    title: `Temporada 1 - Capítulo ${i + 1}`,
    url: `https://www.youtube.com/embed?listType=playlist&list=PL06debXY-tNzgJOjY2jFUDFo6oyPlfFIL&index=${i}`
  })),
  ...Array.from({length: 26}, (_, i) => ({
    title: `Temporada 2 - Capítulo ${i + 1}`,
    url: `https://www.youtube.com/embed?listType=playlist&list=PL06debXY-tNwaWywkY9aP63a9Pi4KloyA&index=${i}`
  }))
];

function mkEpisodesFromLink(baseUrl, n){
  const match = baseUrl.match(/^(.*?)(\d+)([^\d]*)$/);
  if(!match) return Array.from({length:n}, (_,i)=>({title:`Capítulo ${i+1}`, url: baseUrl}));
  const [, prefix, numStr, suffix] = match;
  const startNum = parseInt(numStr, 10);
  const pad = numStr.length;

  return Array.from({length:n}, (_,i)=>{
    const num = startNum + i;
    return {
      title: `Capítulo ${i+1}`,
      url: `${prefix}${String(num).padStart(pad,"0")}${suffix}`
    };
  });
}

function buildDailyChannel(id, num, name, logo, rows, opts={}){
  return {
    id, num, name, logo,
    streamUrl: opts.streamUrl || null,
    embedUrl: opts.embedUrl || null,
    blocks: rows.map(r=>({
      days: [0,1,2,3,4,5,6], start:r.start, end:r.end,
      show:{
        title:r.title, epMin:r.epMin || 30,
        episodes: r.episodes || mkEpisodesFromLink(r.link || "https://www.lacartoons.com", r.count || 1)
      }
    }))
  };
}

const FOXKIDS_ROWS = [
  {start:"00:00", end:"00:30", title:"INSOMNIA: Los Misterios de Moville", count:26, link:"https://www.lacartoons.com/serie/capitulo/9138"},
  {start:"00:30", end:"01:00", title:"INSOMNIA: La Momia", count:26, link:"https://www.lacartoons.com/serie/capitulo/26226"},
  {start:"01:00", end:"01:30", title:"INSOMNIA: Spider-Man", count:63, link:"https://www.lacartoons.com/serie/capitulo/5300"},
  {start:"01:30", end:"02:00", title:"INSOMNIA: X-Men", count:76, link:"https://www.lacartoons.com/serie/capitulo/10484"},
  {start:"02:00", end:"02:30", title:"Beast Wars", count:100, link:"https://www.lacartoons.com/serie/capitulo/5436"},
  {start:"02:30", end:"03:00", title:"W.I.T.C.H.", episodes: WITCH_EPISODES},
  {start:"03:00", end:"03:30", title:"W.I.T.C.H.", episodes: WITCH_EPISODES},
  {start:"03:30", end:"04:00", title:"Shaman King", count:64, link:"https://www.lacartoons.com/serie/capitulo/5172"}
];

const NICK_ROWS = [
  {start:"00:00", end:"00:30", title:"Los Castores Cascarrabias", count:62, link:"https://www.lacartoons.com/serie/capitulo/31397"},
  {start:"00:30", end:"01:00", title:"CatDog", count:68, link:"https://www.lacartoons.com/serie/capitulo/180"},
  {start:"01:00", end:"01:30", title:"Oye Arnold!", count:100, link:"https://www.lacartoons.com/serie/capitulo/9612"}
];

const DISNEY_ROWS = [
  {start:"00:00", end:"00:30", title:"Gummy Bears", count:95, link:"https://www.lacartoons.com/serie/capitulo/23495"},
  {start:"00:30", end:"01:00", title:"Winnie The Pooh", count:49, link:"https://www.lacartoons.com/serie/capitulo/17453"}
];

const CN_ROWS = [
  {start:"01:00", end:"01:30", title:"Hora de Aventura", count:283, link:"https://www.lacartoons.com/serie/capitulo/22721"},
  {start:"15:00", end:"15:30", title:"Winx Club", episodes: WINX_EPISODES}
];

const CHANNELS = [
  buildDailyChannel("magickids", 3, "Magic Kids", "logo-magickids.png", [], { streamUrl: MAGIC_KIDS_STREAM_URL }),
  buildDailyChannel("cn", 5, "Cartoon Network", "logo-cn.png", CN_ROWS),
  buildDailyChannel("nick", 7, "Nickelodeon", "logo-nick.png", NICK_ROWS),
  buildDailyChannel("foxkids", 9, "Fox Kids", "logo-foxkids.png", FOXKIDS_ROWS),
  buildDailyChannel("disney", 11, "Disney Channel", "logo-disney.png", DISNEY_ROWS),
  buildDailyChannel("locomotion", 21, "Locomotion", "logo-locomotion.png", [], { embedUrl: LOCOMOTION_EMBED_URL }),
];

function parseHM(str){
  const [h,m] = str.split(":").map(Number);
  return h*60+m;
}

function daysBetween(a,b){
  return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate()) - new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
}

function computeNowPlaying(channel, now){
  if(now < EPOCH || !channel.blocks.length) return null;
  const weekday = now.getDay();
  const minutesNow = now.getHours()*60+now.getMinutes()+now.getSeconds()/60;

  const block = channel.blocks.find(b => minutesNow >= parseHM(b.start) && minutesNow < parseHM(b.end));
  if(!block) return null;

  const blockDur = parseHM(block.end)-parseHM(block.start);
  const totalDays = daysBetween(EPOCH, new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const minutesIntoBlock = minutesNow - parseHM(block.start);
  const totalElapsed = totalDays*blockDur + minutesIntoBlock;

  const epMin = block.show.epMin;
  const epCount = block.show.episodes.length;
  const globalIdx = Math.floor(totalElapsed/epMin);
  const epIndex = ((globalIdx % epCount)+epCount) % epCount;
  const offset = totalElapsed % epMin;

  return {
    show: block.show.title,
    episode: block.show.episodes[epIndex],
    offsetMin: Math.floor(offset),
    offsetSec: Math.floor((offset%1)*60),
    epMin
  };
}

let activeChannel = CHANNELS[0].id;
let overrideDate = null;
let lastEmbedKey = null;
let currentHls = null;

function currentSimTime(){
  return overrideDate ? new Date(overrideDate) : new Date();
}

function updateEmbed(ch, info){
  const container = document.getElementById("embedContainer");

  // 1. Locomotion / Embeds directos
  if(ch.embedUrl){
    if(lastEmbedKey === ch.id + "|embed") return;
    lastEmbedKey = ch.id + "|embed";
    container.innerHTML = `<div class="cover"><iframe src="${ch.embedUrl}" allowfullscreen></iframe></div>`;
    return;
  }

  // 2. Magic Kids / Stream HLS .m3u8
  if(ch.streamUrl){
    if(lastEmbedKey === ch.id + "|stream") return;
    lastEmbedKey = ch.id + "|stream";
    container.innerHTML = `
      <div class="cover">
        <div class="player-wrapper">
          <video id="hlsPlayer" autoplay playsinline></video>
        </div>
      </div>`;
    if (Hls.isSupported()) {
      currentHls = new Hls();
      currentHls.loadSource(ch.streamUrl);
      currentHls.attachMedia(document.getElementById("hlsPlayer"));
    }
    return;
  }

  // 3. YouTube
  if(info && info.episode && info.episode.url.includes("youtube.com")){
    const key = ch.id + "|" + info.episode.title;
    if(key === lastEmbedKey) return;
    lastEmbedKey = key;
    container.innerHTML = `<div class="cover"><iframe src="${info.episode.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
    return;
  }

  // 4. La Cartoons (Página externa sin iframe bloqueado)
  if(info && info.episode && info.episode.url){
    const key = ch.id + "|" + info.episode.title;
    if(key === lastEmbedKey) return;
    lastEmbedKey = key;
    container.innerHTML = `
      <div class="cover">
        <div class="external-player-card">
          <h3>${info.show}</h3>
          <p>${info.episode.title}</p>
          <a class="btn-play-external" href="${info.episode.url}" target="_blank" rel="noopener">
            ▶ REPRODUCIR CAPÍTULO EN LACARTOONS
          </a>
        </div>
      </div>`;
    return;
  }

  // Si no hay video
  if(!info){
    lastEmbedKey = null;
    container.innerHTML = "";
  }
}

function render(){
  const now = currentSimTime();

  document.getElementById("liveDate").textContent =
    now.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'}) + ' · ' + now.toLocaleTimeString('es-AR');

  const list = document.getElementById("channelList");
  list.innerHTML = CHANNELS.map(ch => `
    <div class="ch-row ${ch.id===activeChannel?'active':''}" onclick="selectChannel('${ch.id}')">
      <div class="ch-num">${ch.num}</div>
      <div class="ch-name">
        <img class="ch-logo" src="${ch.logo}" alt="${ch.name}" onerror="this.style.display='none'">
        <span>${ch.name}</span>
      </div>
    </div>
  `).join("");

  const ch = CHANNELS.find(c=>c.id===activeChannel);
  const info = computeNowPlaying(ch, now);

  updateEmbed(ch, info);

  const main = document.getElementById("mainPanel");
  if(!info && !ch.streamUrl && !ch.embedUrl){
    main.innerHTML = `
      <p class="eyebrow">Canal ${ch.num} · ${ch.name} <img class="panel-logo" src="${ch.logo}" onerror="this.style.display='none'"></p>
      <div class="off-air">Fuera de programación en este horario</div>
    `;
  } else if(ch.streamUrl || ch.embedUrl) {
    main.innerHTML = `<p class="eyebrow">Canal ${ch.num} · ${ch.name} <img class="panel-logo" src="${ch.logo}" onerror="this.style.display='none'"> · Transmisión en vivo</p>`;
  } else {
    const totalDurationSec = info.epMin * 60;
    const elapsedSec = info.offsetMin * 60 + info.offsetSec;
    const remainingSec = Math.max(0, totalDurationSec - elapsedSec);

    const remMin = Math.floor(remainingSec / 60);
    const remSec = Math.floor(remainingSec % 60);
    const pctRemaining = (remainingSec / totalDurationSec) * 100;

    main.innerHTML = `
      <p class="eyebrow">Canal ${ch.num} · ${ch.name} <img class="panel-logo" src="${ch.logo}" onerror="this.style.display='none'"></p>
      <h2 class="show-title">${info.show}</h2>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pctRemaining}%"></div></div>
        <div class="progress-labels">
          <span>Tiempo restante: ${String(remMin).padStart(2,"0")}:${String(remSec).padStart(2,"0")}</span>
          <span>Bloque de ${info.epMin}:00 min</span>
        </div>
      </div>
    `;
  }

  const ticker = CHANNELS.map(c=>{
    const i = computeNowPlaying(c, now);
    return `CANAL ${c.num} ${c.name}: ${(c.streamUrl || c.embedUrl) ? 'transmisión en vivo' : (i ? i.show : 'fuera de aire')}`;
  }).join("     •     ");
  document.getElementById("tickerText").textContent = ticker + "     •     ";
}

function selectChannel(id){
  if(id===activeChannel) return;
  activeChannel = id;
  const flash = document.getElementById("flash");
  flash.classList.add("on");
  setTimeout(()=>flash.classList.remove("on"), 80);
  render();
}

function sintonizar(){
  const val = document.getElementById("dtInput").value;
  if(!val) return;
  overrideDate = new Date(val);
  render();
}

function volverEnVivo(){
  overrideDate = null;
  document.getElementById("dtInput").value = "";
  render();
}

setInterval(render, 1000);
render();
</script>

</body>
</html>
