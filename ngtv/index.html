  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Archivo+Narrow:wght@400;600&display=swap');

  :root{
    --bg: #0a0e18;
    --panel: #0f1b2e;
    --guide: #142a4d;
    --cyan: #4be0e8;
    --yellow: #ffcf3f;
    --ink: #e8ecf4;
    --muted: #6f85ab;
    --line: #23385c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--ink);
    font-family:'Archivo Narrow', sans-serif;
    display:flex; justify-content:center;
  }
  .tv{
    width:100%; max-width:920px; background:var(--panel);
    border:2px solid var(--line); border-radius:10px; overflow:hidden;
    position:relative;
  }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    opacity:.35;
  }
  .static-flash{
    position:absolute; inset:0; background:var(--ink); opacity:0; pointer-events:none; z-index:6;
    transition:opacity .08s;
  }
  .static-flash.on{opacity:.9;}

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 20px; border-bottom:2px solid var(--line); background:var(--guide);
  }
  .brand{font-family:'VT323', monospace; font-size:26px; color:var(--yellow); letter-spacing:1px;}
  .clockbox{display:flex; align-items:center; gap:10px; font-family:'VT323', monospace; font-size:20px; color:var(--cyan);}
  .clockbox input[type="datetime-local"]{
    background:#0a1830; color:var(--ink); border:1px solid var(--line); border-radius:4px;
    font-family:'VT323', monospace; font-size:16px; padding:3px 6px;
  }
  .clockbox button{
    background:var(--cyan); color:#04222a; border:none; border-radius:4px; padding:5px 10px;
    font-family:'Archivo Narrow', sans-serif; font-weight:600; font-size:12px; cursor:pointer;
  }
  .clockbox button:hover{background:#7dedf3;}
  .clockbox .live{
    background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400;
  }
  .live-date{color:var(--ink); font-size:16px; padding-right:4px;}

  .body{display:flex; min-height:420px;}
  .channels{
    width:190px; border-right:2px solid var(--line); background:#0b1524;
  }
  .ch-row{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .ch-row:hover{background:#122543;}
  .ch-row.active{background:var(--guide); box-shadow:inset 3px 0 0 var(--yellow);}
  .ch-num{
    font-family:'VT323', monospace; font-size:22px; color:var(--muted); width:26px; text-align:right;
  }
  .ch-row.active .ch-num{color:var(--yellow);}
  .ch-name{font-size:14px; font-weight:600;}
  .ch-row.active .ch-name{color:var(--yellow);}

  .main{flex:1; padding:22px 26px;}

  /* ── REPRODUCTOR DE VIDEO Y MARCO ── */
  .cover{
    width:100%; height:520px; background:#000; border:1px solid var(--line);
    border-radius:6px; overflow:hidden; margin-bottom:18px; position:relative;
  }

  .cover iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  
  .video-container, .player-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .video-container video, .player-wrapper video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }

  /* Barra de controles personalizada */
  .custom-controls{
    position:absolute; bottom:0; left:0; right:0; height:48px;
    background:linear-gradient(transparent, rgba(0,0,0,0.85));
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; opacity:0; transition:opacity 0.3s ease; z-index:20;
  }
  .player-wrapper:hover .custom-controls{ opacity:1; }

  .ctrl-group{ display:flex; align-items:center; gap:12px; }

  .ctrl-btn{
    background:transparent; border:none; color:var(--ink);
    font-size:18px; cursor:pointer; padding:4px 8px; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
  }
  .ctrl-btn:hover{ color:var(--yellow); background:rgba(255,255,255,0.1); }

  .live-tag{
    display:flex; align-items:center; gap:6px;
    font-family:'VT323', monospace; font-size:18px; color:#ff4757;
    background:rgba(255,71,87,0.15); padding:2px 8px; border-radius:4px; border:1px solid rgba(255,71,87,0.3);
  }
  .live-dot{
    width:8px; height:8px; background:#ff4757; border-radius:50%;
    animation:blink 1.2s infinite ease-in-out;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .volume-slider{
    width:70px; accent-color:var(--yellow); cursor:pointer;
  }

  .eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 4px;}
  .show-title{font-family:'VT323', monospace; font-size:34px; color:var(--ink); margin:0 0 2px; line-height:1;}

  .watch-link{
    display:inline-flex; align-items:center; gap:8px; background:var(--yellow); color:#2a1e00;
    text-decoration:none; font-weight:600; font-size:13px; padding:8px 14px; border-radius:5px;
    margin-bottom:18px;
  }
  .watch-link:hover{background:#ffe08a;}

  .stream-alt-btn{
    display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--cyan);
    border:1px solid var(--cyan); text-decoration:none; font-weight:600; font-size:13px;
    padding:6px 12px; border-radius:4px; cursor:pointer; transition:all 0.2s ease;
  }
  .stream-alt-btn:hover{
    background:var(--cyan); color:#04222a;
  }

  .progress-wrap{margin-bottom:6px;}
  .progress-bar{
    height:10px; background:#0a1830; border:1px solid var(--line); border-radius:5px; overflow:hidden;
  }
  .progress-fill{height:100%; background:var(--yellow);}
  .progress-labels{
    display:flex; justify-content:space-between; font-family:'VT323', monospace; font-size:15px; color:var(--muted); margin-top:4px;
  }

  .up-next{
    margin-top:26px; padding-top:14px; border-top:1px dashed var(--line);

  .up-next .eyebrow{margin-bottom:8px;}

  .off-air{font-family:'VT323', monospace; font-size:22px; color:var(--muted); padding:40px 0;}

  .ticker{
    border-top:2px solid var(--line); background:#0b1524; padding:8px 0; overflow:hidden; white-space:nowrap;
  }
  .ticker span{
    display:inline-block; padding-left:100%; font-family:'VT323', monospace; font-size:16px; color:var(--muted);
    animation:scroll 28s linear infinite;
  }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
</style>

function mkEpisodes(n){
  return Array.from({length:n}, (_,i)=>({title:`Capítulo ${i+1}`}));
}

function mkEpisodesFromLink(baseUrl, n, opts={}){
  if (opts.customEpisodes) return opts.customEpisodes;

  const match = baseUrl.match(/^(.*?)(\d+)([^\d]*)$/);
  if(!match){
    return mkEpisodes(n);
  }
  const [, prefix, numStr, suffix] = match;
  const startNum = parseInt(numStr, 10);
  const pad = numStr.length;
  const field = opts.field || "url";
  const titlePrefix = opts.titlePrefix || "Capítulo";

  return Array.from({length:n}, (_,i)=>{
    const num = startNum + i;
    const numFormatted = opts.zeroPad ? String(num).padStart(pad,"0") : String(num);
    return {
      title:`${titlePrefix} ${i+1}`,
      [field]: `${prefix}${numFormatted}${suffix}`
    };
  });
}

const PLACEHOLDER = "https://tusitio.com/serie/capitulo/1001";

function buildDailyChannel(id, num, name, rows, opts={}){
  const days = opts.days || [0,1,2,3,4,5,6];
  return {
    id, num, name,
    streamUrl: opts.streamUrl || null,
    embedUrl: opts.embedUrl || null,
    altStreamUrl: opts.altStreamUrl || null,
    blocks: rows.map(r=>({
      days, start:r.start, end:r.end,
      show:{
        title:r.title, epMin:r.epMin || 30,
        episodes: r.episodes || mkEpisodesFromLink(r.link || PLACEHOLDER, r.count, {field:r.field || "url"})
      }
    }))
  };
}

// ── CONFIGURACIÓN DE CANALES ACTUALIZADA (Fox Kids y Jetix ahora usan altStreamUrl) ──
const CHANNELS = [
  buildDailyChannel("magickids", 3, "Magic Kids", MAGICKIDS_ROWS, { altStreamUrl: MAGIC_KIDS_STREAM_URL }),
  buildDailyChannel("cn", 5, "Cartoon Network", CN_ROWS, { altStreamUrl: CN_ALT_STREAM_URL }),
  buildDailyChannel("nick", 7, "Nickelodeon", NICK_ROWS),
  buildDailyChannel("foxkids", 9, "Fox Kids", FOXKIDS_ROWS, { altStreamUrl: FOXKIDS_EMBED_URL }),
  buildDailyChannel("disney", 11, "Disney Channel", DISNEY_ROWS),
  buildDailyChannel("locomotion", 21, "Locomotion", LOCOMOTION_ROWS, { embedUrl: LOCOMOTION_EMBED_URL }),
];

function parseHM(str){
  const [h,m] = str.split(":").map(Number);
  return h*60+m;
}

function daysBetween(a,b){
  const ms = new Date(b.getFullYear(),b.getMonth(),b.getDate()) - new Date(a.getFullYear(),a.getMonth(),a.getDate());
  return Math.round(ms/86400000);
}

function computeNowPlaying(channel, now){
  if(now < EPOCH) return null;

  const weekday = now.getDay();
  const minutesNow = now.getHours()*60+now.getMinutes()+now.getSeconds()/60;

  const block = channel.blocks.find(b => b.days.includes(weekday) &&
    minutesNow >= parseHM(b.start) && minutesNow < parseHM(b.end));
  if(!block) return null;

  const blockDur = parseHM(block.end)-parseHM(block.start);
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  let fullOccurrences = 0;
  const totalDays = daysBetween(EPOCH, todayMid);
  for(let d=0; d<totalDays; d++){
    const day = new Date(EPOCH); day.setDate(day.getDate()+d);
    if(block.days.includes(day.getDay())) fullOccurrences++;
  }

  const minutesIntoBlockToday = minutesNow - parseHM(block.start);
  const totalElapsed = fullOccurrences*blockDur + minutesIntoBlockToday;

  const epMin = block.show.epMin;
  const epCount = block.show.episodes.length;
  const globalIdx = Math.floor(totalElapsed/epMin);
  const epIndex = ((globalIdx % epCount)+epCount) % epCount;
  const offset = totalElapsed % epMin;

  const nextEpIndex = (epIndex+1) % epCount;

  const entries = [];
  channel.blocks.forEach(b=>{
    b.days.forEach(d=>{
      entries.push({weekMin: d*1440 + parseHM(b.start), title: b.show.title});
    });
  });
  entries.sort((a,b)=>a.weekMin-b.weekMin);
  const pivot = weekday*1440 + parseHM(block.end);
  
  // CORRECCIÓN "A CONTINUACIÓN": Se usa >= para incluir el programa que empieza exactamente al terminar el actual
  let nextEntry = entries.find(e=>e.weekMin >= pivot);
  if(!nextEntry) nextEntry = entries[0];
  const nextShow = nextEntry ? nextEntry.title : null;

  return {
    show: block.show.title,
    nextShow,
    episode: block.show.episodes[epIndex],
    nextEpisode: block.show.episodes[nextEpIndex],
    offsetMin: Math.floor(offset),
    offsetSec: Math.floor((offset%1)*60),
    epMin,
    embedTimeParam: block.show.embedTimeParam || "fromTime",
    blockEnd: block.end,
  };
}

function fmt(m,s){
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

let activeChannel = CHANNELS[0].id;
let overrideDate = null;
let lastEmbedKey = null;
let currentHls = null;

function currentSimTime(){
  return overrideDate ? new Date(overrideDate) : new Date();
}

// ── CONTROLADORES DE VIDEO ──
function togglePlay(){
  const video = document.getElementById("hlsPlayer");
  const playBtn = document.getElementById("playBtn");
  if(!video) return;
  if(video.paused){
    video.play();
    if(playBtn) playBtn.textContent = "❚❚";
  }else{
    video.pause();
    if(playBtn) playBtn.textContent = "▶";
  }
}

function toggleMute(){
  const video = document.getElementById("hlsPlayer");
  const muteBtn = document.getElementById("muteBtn");
  if(!video) return;
  video.muted = !video.muted;
  if(muteBtn) muteBtn.textContent = video.muted ? "🔇" : "🔊";
}

function setVolume(val){
  const video = document.getElementById("hlsPlayer");
  if(!video) return;
  video.volume = val;
  video.muted = val == 0;
  const muteBtn = document.getElementById("muteBtn");
  if(muteBtn) muteBtn.textContent = video.muted ? "🔇" : "🔊";
}

function toggleFullscreen(){
  const wrapper = document.getElementById("playerWrapper");
  if(!wrapper) return;
  if(!document.fullscreenElement){
    wrapper.requestFullscreen().catch(err=>{});
  }else{
    document.exitFullscreen();
  }
}

function loadHlsStream(streamUrl) {
  const video = document.getElementById("hlsPlayer");
  if (!video) return;

  if (currentHls) {
    currentHls.destroy();
  }

  function playWithAudio() {
    const promise = video.play();
    if (promise !== undefined) {
      promise.catch(() => {
        video.muted = true;
        video.play();
        const muteBtn = document.getElementById("muteBtn");
        if(muteBtn) muteBtn.textContent = "🔇";
      });
    }
  }

  if (Hls.isSupported()) {
    currentHls = new Hls();
    currentHls.loadSource(streamUrl);
    currentHls.attachMedia(video);
    currentHls.on(Hls.Events.MANIFEST_PARSED, function () {
      playWithAudio();
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = streamUrl;
    playWithAudio();
  }
}

// ── CONFIGURACIÓN DEL EXTRACTOR DE CLOUDFLARE ──
const PROXY_WORKER_URL = "https://extractor-series.nah-d-ruiz.workers.dev/"; 

async function getCleanEmbedUrl(pageUrl) {
  try {
    const res = await fetch(`${PROXY_WORKER_URL}?url=${encodeURIComponent(pageUrl)}`);
    const data = await res.json();
    return data.embedUrl || pageUrl;
  } catch (e) {
    return pageUrl;
  }
}

// ── ACTUALIZACIÓN DEL REPRODUCTOR EN PANTALLA ──
async function updateEmbed(ch, info){
  const container = document.getElementById("embedContainer");

  // A) MODO IFRAME DIRECTO (Locomotion, etc.)
  if(ch.embedUrl){
    const key = ch.id + "|embed";
    if(key === lastEmbedKey) return;
    lastEmbedKey = key;
    if (currentHls) { currentHls.destroy(); currentHls = null; }

    container.innerHTML = `
      <div class="cover">
        <iframe src="${ch.embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>`;
    return;
  }

  // B) MODO STREAMING DIRECTO (.m3u8 - Magic Kids)
  if(ch.streamUrl){
    const key = ch.id + "|" + ch.streamUrl;
    if(key === lastEmbedKey) return;
    lastEmbedKey = key;

    container.innerHTML = `
      <div class="cover">
        <div class="player-wrapper" id="playerWrapper">
          <video id="hlsPlayer" playsinline></video>
          <div class="custom-controls">
            <div class="ctrl-group">
              <button class="ctrl-btn" id="playBtn" onclick="togglePlay()">❚❚</button>
              <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
              <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
            </div>
            <div class="ctrl-group">
              <div class="live-tag"><span class="live-dot"></span> EN VIVO</div>
              <button class="ctrl-btn" onclick="toggleFullscreen()">⛶</button>
            </div>
          </div>
        </div>
      </div>`;
    loadHlsStream(ch.streamUrl);
    return;
  }

  // C) MODO REPRODUCCIÓN DE CAPÍTULOS (YouTube / LaCartoons)
  if(info && info.episode && info.episode.url){
    const key = ch.id + "|" + info.episode.title;
    if(key === lastEmbedKey) return;
    lastEmbedKey = key;

    if (currentHls) { currentHls.destroy(); currentHls = null; }

    let finalEmbedUrl = info.episode.url;

    // Si NO es un enlace de YouTube, pasa por el extractor de LaCartoons
    if (!finalEmbedUrl.includes("youtube.com") && !finalEmbedUrl.includes("youtu.be")) {
      container.innerHTML = `<div class="cover" style="display:flex; justify-content:center; align-items:center; color:var(--cyan); font-family:'VT323', monospace; font-size:24px;">Sintonizando episodio...</div>`;
      finalEmbedUrl = await getCleanEmbedUrl(info.episode.url);
    }

    container.innerHTML = `
      <div class="cover">
        <iframe src="${finalEmbedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>`;
    return;
  }

  if(!info || !info.episode){
    if(lastEmbedKey !== null){
      container.innerHTML = "";
      lastEmbedKey = null;
      if (currentHls) { currentHls.destroy(); currentHls = null; }
    }
  }
}

function render(){
  const now = currentSimTime();

  document.getElementById("liveDate").textContent =
    now.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}) +
    ' · ' + now.toLocaleTimeString('es-AR');

  const list = document.getElementById("channelList");
  list.innerHTML = CHANNELS.map(ch => `
    <div class="ch-row ${ch.id===activeChannel?'active':''}" onclick="selectChannel('${ch.id}')">
      <div class="ch-num">${ch.num}</div>
      <div class="ch-name">${ch.name}</div>
    </div>
  `).join("");

  const ch = CHANNELS.find(c=>c.id===activeChannel);
  const info = computeNowPlaying(ch, now);
  const main = document.getElementById("mainPanel");

  updateEmbed(ch, info);

  if(!info && !ch.streamUrl && !ch.embedUrl){
    const notStarted = now < EPOCH;
    main.innerHTML = `
      <p class="eyebrow">Canal ${ch.num} · ${ch.name}</p>
      <div class="off-air">${notStarted ? 'La programación todavía no arrancó' : 'Fuera de programación en este horario'}<br><span style="font-size:15px;">${notStarted ? `Arranca el ${EPOCH.toLocaleDateString('es-AR')}` : ''}</span></div>
    `;
  } else if(ch.streamUrl || ch.embedUrl) {
    main.innerHTML = `<p class="eyebrow">Canal ${ch.num} · ${ch.name} · Transmisión en vivo</p>`;
  } else {
    const pct = Math.min(100, (info.offsetMin*60+info.offsetSec)/(info.epMin*60)*100);

    let linkHtml = "";
    if(info.episode.url){
      linkHtml = `<a class="watch-link" href="${info.episode.url}" target="_blank" rel="noopener">▶ Ver este capítulo</a>`;
    }

    const altBtnHtml = ch.altStreamUrl ? `
      <a class="stream-alt-btn" href="${ch.altStreamUrl}" target="_blank" rel="noopener">
        📺 Stream Alterno
      </a>` : '';

    main.innerHTML = `
      <p class="eyebrow">Canal ${ch.num} · ${ch.name} · ahora</p>
      <h2 class="show-title">${info.show}</h2>
      ${linkHtml}
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-labels">
          <span>${fmt(info.offsetMin, info.offsetSec)}</span>
          <span>${String(info.epMin).padStart(2,"0")}:00</span>
        </div>
      </div>
      <div class="up-next">
        <div class="up-next-info">
          <p class="eyebrow">A continuación</p>
          <p class="up-next-item">${info.nextShow || 'Fin de transmisión'}</p>
        </div>
        ${altBtnHtml}
      </div>
    `;
  }

  const ticker = CHANNELS.map(c=>{
    const i = computeNowPlaying(c, now);
    return `CANAL ${c.num} ${c.name}: ${(c.streamUrl || c.embedUrl) ? 'transmisión en vivo' : (i ? i.show : 'fuera de aire')}`;
  }).join("     •     ");
  document.getElementById("tickerText").textContent = ticker + "     •     ";
}

function selectChannel(id){
  if(id===activeChannel) return;
  activeChannel = id;
  const flash = document.getElementById("flash");
  flash.classList.add("on");
  setTimeout(()=>flash.classList.remove("on"), 80);
  render();
}

function sintonizar(){
  const val = document.getElementById("dtInput").value;
  if(!val) return;
  overrideDate = new Date(val);
  render();
}

function volverEnVivo(){
  overrideDate = null;
  document.getElementById("dtInput").value = "";
  render();
}

function prefillDtInput(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  document.getElementById("dtInput").value = d.toISOString().slice(0,16);
}

setInterval(render, 1000);
prefillDtInput();
render();
</script>
